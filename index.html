<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>斑马 S3 · 果冻冒险营地</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="果冻营地">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF7E9">
<link rel="apple-touch-icon" href="assets/icon/icon180.png">
<link rel="manifest" href="site.webmanifest">
<style>
:root{
  --cream:#FFF7E9; --cocoa:#6B4630; --cocoa2:#8A6146;
  --green:#8FD86E; --pink:#FF9BB6; --orange:#FFB44D; --red:#FF7A6B; --yellow:#FFE066;
  --jelly-shadow:0 10px 0 rgba(150,100,60,.18), 0 18px 32px rgba(120,80,50,.18);
  --card:rgba(255,252,244,.92);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--cocoa); background:#FFE9CF; overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
.stage{position:fixed;inset:0;background-size:cover;background-position:center;transition:background-image .35s;transform:translateZ(0);backface-visibility:hidden}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,240,220,.18),rgba(255,220,190,.30));pointer-events:none}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(2.4vh + env(safe-area-inset-top)) calc(2.4vw + env(safe-area-inset-right)) calc(2.4vh + env(safe-area-inset-bottom)) calc(2.4vw + env(safe-area-inset-left));gap:1.6vh;z-index:2}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--jelly-shadow);border:2px solid rgba(255,255,255,.9)}
.h1{font-size:clamp(20px,2.5vw,32px);font-weight:900;letter-spacing:.02em}
.h2{font-size:clamp(16px,1.7vw,22px);font-weight:800}
.mut{color:var(--cocoa2);font-weight:600}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;white-space:nowrap;
  border-radius:999px;padding:.9em 2.2em;font-size:clamp(16px,1.8vw,22px);
  background:linear-gradient(180deg,#F9A03F,#E06A0B);
  text-shadow:0 1px 2px rgba(90,40,0,.35);
  box-shadow:0 6px 0 #B45401, 0 12px 22px rgba(210,120,40,.28), inset 0 2px 6px rgba(255,255,255,.7);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #D97A22,0 6px 12px rgba(210,120,40,.25),inset 0 2px 6px rgba(255,255,255,.7)}
.btn.green{background:linear-gradient(180deg,#A7E68C,#6FCE55);box-shadow:0 6px 0 #4CA43A,0 12px 22px rgba(80,170,70,.25),inset 0 2px 6px rgba(255,255,255,.7)}
.btn.pink{background:linear-gradient(180deg,#FFB6C9,#FF8AA8);box-shadow:0 6px 0 #D9627F,0 12px 22px rgba(220,110,140,.25),inset 0 2px 6px rgba(255,255,255,.7)}
.btn.ghost{background:rgba(255,255,255,.75);color:var(--cocoa);text-shadow:none;box-shadow:0 4px 0 rgba(150,110,80,.22),inset 0 2px 6px rgba(255,255,255,.9)}
.btn.danger{background:linear-gradient(180deg,#F26D5B,#CF3B2A);text-shadow:0 1px 2px rgba(80,10,0,.4);box-shadow:0 5px 0 #9E2718,0 10px 20px rgba(200,70,50,.28),inset 0 2px 6px rgba(255,255,255,.35)}
.dangerZone{margin-top:2vh;padding:1.8vh 1.4vw;border-radius:18px;background:rgba(255,236,232,.9);border:2px dashed #F0A798;display:flex;flex-direction:column;gap:1vh;align-items:flex-start}
.btn.sm{padding:.55em 1.3em;font-size:clamp(13px,1.35vw,17px)}
.row{display:flex;gap:1.2vw;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:1.2vh;align-items:center}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(2vh + env(safe-area-inset-top)) calc(2.4vw + env(safe-area-inset-right)) 2vh calc(2.4vw + env(safe-area-inset-left));z-index:3;pointer-events:none}
.topbar > *{pointer-events:auto}
/* 本周 3 格进度 + 星星串 */
.slotRow{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.8);border-radius:999px;padding:.35em .8em;box-shadow:0 4px 12px rgba(130,90,60,.14)}
.stampSlot{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#A79379;background:#F1E7D8;border:2px dashed #D8C6AB}
.stampSlot.on{color:#2F5E1E;background:linear-gradient(180deg,#D9F7C4,#9BE07C);border:2px solid #74C255;box-shadow:0 3px 8px rgba(90,170,60,.25);animation:slotIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes slotIn{from{transform:scale(.6)}to{transform:scale(1)}}
.starStr{display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.8);border-radius:999px;padding:.35em .8em;box-shadow:0 4px 12px rgba(130,90,60,.14)}
.starMini{width:18px;height:18px;background:radial-gradient(circle at 38% 30%,#FFE7A8,#FFC24D 40%,#F08A2B 78%);clip-path:polygon(50% 2%,61% 35%,95% 35%,68% 56%,78% 90%,50% 70%,22% 90%,32% 56%,5% 35%,39% 35%)}
.chip{background:rgba(255,255,255,.86);border-radius:999px;padding:.5em 1.1em;font-weight:800;font-size:clamp(13px,1.4vw,17px);box-shadow:0 4px 12px rgba(130,90,60,.16);display:flex;align-items:center;gap:.5em}
.dot{width:.65em;height:.65em;border-radius:50%;display:inline-block}
/* ===== 今日营地 P01 ===== */
.campGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:1.6vw;width:min(1180px,92vw);max-height:74vh}
.dueCard{display:flex;flex-direction:column;gap:1.2vh;padding:2.2vh 2vw;position:relative;overflow:hidden}
.bigNum{font-size:clamp(28px,4vw,52px);font-weight:900;line-height:1.05}
.stepRow{display:flex;gap:.9vw}
.stepLine{width:100%;padding:1.3vh 1vw;border-radius:14px;background:rgba(255,247,233,.9);color:#8A6A4A;font-weight:700;font-size:clamp(13px,1.4vw,16px);line-height:1.5}
.stepLine b{color:#E4761B;font-size:1.25em}
.step{flex:1;height:clamp(38px,5vh,58px);border-radius:16px;background:linear-gradient(180deg,#F3E7D4,#E7D6BE);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(13px,1.4vw,18px);color:#A98B6C;box-shadow:inset 0 -4px 0 rgba(160,130,100,.25)}
.step.on{background:linear-gradient(180deg,#FFE28D,#FFC24D);color:#7A4B12;box-shadow:inset 0 -4px 0 rgba(200,140,40,.4),0 4px 12px rgba(255,190,80,.45)}
.step.done{background:linear-gradient(180deg,#BEE8B8,#8FD989);color:#245A24;box-shadow:inset 0 -4px 0 rgba(90,150,80,.35)}
.step{flex-direction:column;gap:2px;line-height:1.15}
.step .mut{font-size:clamp(10px,.95vw,12px);font-weight:700;opacity:.85}
.miniCard{display:flex;align-items:center;gap:1vw;padding:1.4vh 1.2vw;border-radius:20px;background:rgba(255,255,255,.7);box-shadow:0 6px 16px rgba(140,100,70,.12)}
.thumb{width:clamp(52px,6vw,78px);height:clamp(52px,6vw,78px);border-radius:16px;background:#FFFBF2 center/contain no-repeat;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 4px 10px rgba(140,100,70,.14)}
.duck{width:clamp(76px,8.6vw,120px);position:absolute;right:-4px;top:-6px;filter:drop-shadow(0 8px 14px rgba(170,120,80,.3));pointer-events:none}
.dueCard{padding-right:clamp(96px,10.4vw,138px)}
/* ===== 路线 P02 ===== */
.routeWrap{width:min(1180px,94vw);max-height:78vh;display:flex;flex-direction:column;gap:1.6vh}
.unitStrip{display:flex;gap:.7vw;overflow-x:auto;padding-bottom:.6vh;flex-shrink:0;width:100%;min-width:0}
/* 路线页表头：日期一行、复习/总结/加练另起一行小字，窄屏也不挤成一坨 */
.dayHd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;line-height:1.15;white-space:nowrap}
.dayHd b{font-weight:900;font-size:clamp(12px,1.35vw,17px);color:var(--cocoa)}
.dayHd i{font-style:normal;font-weight:700;font-size:clamp(10px,1.05vw,13px);color:#C07A3A}
.uChip{flex:0 0 auto;padding:.55em 1em;border-radius:14px;background:rgba(255,255,255,.8);font-weight:800;font-size:clamp(12px,1.3vw,16px);box-shadow:0 4px 10px rgba(140,100,70,.12);cursor:pointer;border:2px solid transparent}
.uChip.sel{border-color:#FFB44D;background:#FFF3DC}
.uChip.done{background:linear-gradient(180deg,#DFF6D3,#BEEAA9)}
.weekGrid{display:grid;grid-template-columns:minmax(72px,auto) repeat(6,minmax(0,1fr));gap:1.1vh 1vw;align-items:center;padding:2vh 1.6vw;border-radius:24px;background:rgba(255,255,255,.86);box-shadow:0 10px 28px rgba(140,100,70,.16);width:min(800px,92vw)}
.node{aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:clamp(13px,1.7vw,22px);background:radial-gradient(circle at 30% 25%,#FFD98A,#F0A83C);box-shadow:0 4px 0 rgba(190,120,40,.45),inset 0 2px 6px rgba(255,255,255,.6);cursor:pointer;position:relative}
.node.lock{background:radial-gradient(circle at 30% 25%,#EBE3D6,#D3C6B2);color:#9C8B76;cursor:not-allowed;box-shadow:0 4px 0 rgba(160,140,120,.3)}
.node.boss{background:radial-gradient(circle at 30% 25%,#FFC0D2,#F0709A)}
.node .st{position:absolute;bottom:-14px;font-size:10px;color:#FFB400;text-shadow:0 1px 0 #fff}
/* ===== 答题 P03 ===== */
.quizBar{width:min(1100px,94vw);display:flex;align-items:center;gap:1vw}
.prog{flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 2px 6px rgba(150,110,80,.2)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#FFD166,#FF9E3D);border-radius:999px;transition:width .3s}
.qCard{width:min(1100px,94vw);max-height:62vh;padding:2.4vh 2vw;display:flex;flex-direction:column;align-items:center;gap:2vh}
.quizWrap .qCard{margin-top:auto;margin-bottom:auto}
.qImg{width:clamp(160px,22vh,260px);height:clamp(160px,22vh,260px);border-radius:24px;background:#FFFEF9 center/contain no-repeat;box-shadow:inset 0 0 0 3px #fff,0 10px 26px rgba(140,100,70,.18)}
.optGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;width:100%}
.opt{padding:1.6vh 1vw;border-radius:18px;background:rgba(255,255,255,.9);font-weight:900;font-size:clamp(16px,2vw,26px);text-align:center;cursor:pointer;box-shadow:0 5px 0 rgba(160,120,80,.22),inset 0 2px 6px rgba(255,255,255,.9);transition:transform .08s}
.opt:active{transform:translateY(3px)}
/* 答对时果冻弹一下（纯 CSS，不引库） */
.opt.ok{animation:optPop .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes optPop{0%{transform:scale(1)}45%{transform:scale(1.1)}75%{transform:scale(.95)}100%{transform:scale(1)}}
.opt.ok{background:linear-gradient(180deg,#C6F3B0,#8ED96E);box-shadow:0 5px 0 #5FAF45}
.opt.no{background:linear-gradient(180deg,#FFD3C7,#FF9E8C);box-shadow:0 5px 0 #D46A56}
/* 不只靠颜色：对/错各带符号，红绿色弱也能分辨 */
.opt.ok::after{content:"✓";margin-left:.35em;font-size:1.1em;color:#2F5E1E}
.opt.no::after{content:"✗";margin-left:.35em;font-size:1.1em;color:#8A2A18}
.optImg{padding:.4vh;display:flex;align-items:center;justify-content:center}
.optImg .qImg{width:clamp(90px,13vh,150px);height:clamp(90px,13vh,150px);box-shadow:inset 0 0 0 2px #fff,0 4px 10px rgba(140,100,70,.14)}
.badge{font-size:clamp(30px,5vw,64px);font-weight:900;letter-spacing:.06em;color:#fff;background:linear-gradient(180deg,#FFD166,#F2A03D);padding:.1em .5em;border-radius:16px;box-shadow:0 6px 0 #C97C22,inset 0 3px 8px rgba(255,255,255,.6)}
.sayRow{display:flex;gap:1.4vw;width:100%;justify-content:center}
.sayBtn{flex:1;max-width:280px;padding:1.6vh 1vw;border-radius:18px;font-weight:900;font-size:clamp(14px,1.7vw,20px);cursor:pointer;text-align:center;box-shadow:0 5px 0 rgba(160,120,80,.25),inset 0 2px 6px rgba(255,255,255,.9)}
.sayBtn.g{background:linear-gradient(180deg,#C6F3B0,#8ED96E);color:#2F5E1E}
.sayBtn.y{background:linear-gradient(180deg,#FFE9A8,#FFD166);color:#7A5410}
.sayBtn.r{background:linear-gradient(180deg,#FFD3C7,#FF9E8C);color:#7A2E1E}
.sayBtn:active{transform:translateY(3px)}
/* ===== 结算 P04 ===== */
.resWrap{width:min(980px,92vw);padding:3vh 2.4vw;display:flex;flex-direction:column;align-items:center;gap:2vh;max-height:90vh;overflow-y:auto}
.starRow{display:flex;gap:2vw}
.starBig{width:clamp(64px,11vh,110px);height:clamp(64px,11vh,110px);background:radial-gradient(circle at 38% 30%,#FFE7A8 0%,#FFC24D 38%,#F08A2B 72%,#D96A18 100%);filter:drop-shadow(0 8px 16px rgba(200,140,40,.3));clip-path:polygon(50% 2%,61% 35%,95% 35%,68% 56%,78% 90%,50% 70%,22% 90%,32% 56%,5% 35%,39% 35%)}
.starBig.off{background:linear-gradient(180deg,#E6DCCB,#CFC3AE);filter:none;opacity:.45}
/* 星星逐颗弹出 */
.starBig.pop{animation:starPop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes starPop{0%{transform:scale(0) rotate(-18deg);opacity:0}65%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
/* 鸭子跳一下 */
.duckJump{animation:duckJump .55s ease-out 2}
@keyframes duckJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(-4px) rotate(4deg)}}
/* 家长数据折叠层 */
.resParent{display:none;flex-direction:column;gap:1.2vh;width:100%;align-items:center}
.resStats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;width:100%}
.stat{padding:1.6vh 1vw;border-radius:18px;background:rgba(255,255,255,.85);text-align:center;box-shadow:0 5px 14px rgba(140,100,70,.12)}
.stat b{display:block;font-size:clamp(20px,2.6vw,34px);font-weight:900}
.stat span{font-size:clamp(12px,1.3vw,15px);color:var(--cocoa2);font-weight:700}
.wrongRow{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center}
/* ===== 词卡 P09 ===== */
.cardsWrap{width:min(1240px,95vw);max-height:76vh;display:flex;flex-direction:column;gap:1.4vh}
.cardGrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.7vw;width:100%;max-height:64vh;overflow-y:auto;padding:.6vh .4vw}
.wc{aspect-ratio:1/1;border-radius:14px;background:#FFFFFF center/contain no-repeat;position:relative;box-shadow:0 5px 14px rgba(135,95,60,.16);border:2px solid #FFF8EC}
.wc.gray{filter:saturate(.72)}
.wc.half{filter:saturate(.9)}
.wc.full{box-shadow:0 4px 10px rgba(140,100,70,.14),inset 0 0 0 3px rgba(143,216,110,.55)}
.wc.gold{box-shadow:0 4px 12px rgba(200,150,40,.3),inset 0 0 0 3px rgba(255,196,60,.85)}
/* 掌握度角标：不靠图片本身饱和度区分（很多教材图本来就是灰白线稿） */
.wc .mast{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(120,90,60,.25)}
.wc.gray .mast{background:#B9AFA0}
.wc.half .mast{background:#FFC24D}
.wc.full .mast{background:#7FCE5B}
.wc.gold .mast{background:#FFB300}
/* 升档仪式：放大回弹 + 一道流光 */
.wc.justUp{animation:cardUp .6s cubic-bezier(.34,1.56,.64,1)}
.wc.justUp::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);animation:shine .8s ease-out;pointer-events:none}
@keyframes cardUp{0%{transform:scale(.85)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
/* 低饱和/线稿图的暖色补光，别让它在暖底上像“没加载出来” */
.wc.lowink{background-color:#FFF6E9}
.wc.lowink::before{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(255,190,120,.55);pointer-events:none}
.wc i{position:absolute;bottom:2px;right:4px;font-size:9px;color:#B98F63;font-style:normal;font-weight:800}
/* ===== 勾选复习 ===== */
.drillGrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.6vw;width:100%;padding:.4vh 0}
.drillCell{cursor:pointer;border:2px solid #fff}
.drillCell i{bottom:auto;top:2px;left:4px;right:auto;font-size:9px;color:#6B5334;background:rgba(255,253,246,.82);padding:0 3px;border-radius:6px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drillCell .tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6vh;color:#fff;background:rgba(143,216,110,.86);border-radius:12px;opacity:0;transition:.16s}
.drillCell.on .tick{opacity:1}
.drillCell.on{border-color:#8FD86E;box-shadow:0 0 0 3px rgba(143,216,110,.5)}
.drillCell.gray,.drillCell.half{filter:none}
.drillCell.gray{opacity:.72}
/* 认词小站 */
.sightBox{width:min(960px,92vw);display:flex;flex-direction:column;align-items:center;gap:1.6vh;padding:1vh 0}
.sightGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4vw;width:100%;max-width:900px}
.sightCard{background:#FFFDF6;border:4px solid #fff;border-radius:22px;box-shadow:var(--jelly-shadow);
  display:flex;align-items:center;justify-content:center;min-height:16vh;cursor:pointer;
  font-weight:900;font-size:clamp(30px,4.6vw,60px);color:#6B4630;letter-spacing:.02em;transition:.16s}
.sightCard:active{transform:scale(.97)}
.sightCard.ok{background:#EAFBE0;border-color:#8FD86E;color:#3E7A2A}
.sightCard.no{background:#FFECEA;border-color:#FF7A6B;color:#B4402F}
/* 实测记录表 */
.measTbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.measTbl th,.measTbl td{padding:6px 8px;border-bottom:1px solid #EFE2CC;text-align:left}
.measTbl th{color:#8A6A45;font-weight:800;font-size:12px}
.measTbl td b{color:#5C4327}
/* ===== 句型 P10 ===== */
.paper{width:min(1020px,92vw);background:#FFFDF4;border-radius:18px;padding:4vh 3vw;box-shadow:0 12px 30px rgba(140,100,70,.2),inset 0 0 0 2px #FFF;position:relative;display:flex;flex-direction:column;gap:1.4vh}
.paper::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:18px 18px 0 0;background:repeating-linear-gradient(90deg,#FFC7D6 0 22px,#FFE29A 22px 44px,#BEEAA9 44px 66px,#A9D6FF 66px 88px)}
.sentLine{font-size:clamp(26px,4.3vw,54px);font-weight:900;line-height:1.6;letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:.28em;justify-content:center}
.w{transition:.16s;border-radius:10px;padding:0 .12em}
.w.hot{background:linear-gradient(180deg,#FFE066,#FFC24D);transform:scale(1.06);box-shadow:0 4px 0 rgba(200,150,40,.4)}
.w.done{color:#B99A7A}
.hintRow{display:flex;justify-content:center;gap:.6vw;margin-top:2vh;flex-wrap:wrap}
.tag{padding:.4em 1em;border-radius:999px;background:rgba(255,255,255,.8);font-weight:800;font-size:clamp(12px,1.3vw,16px);cursor:pointer;box-shadow:0 3px 10px rgba(140,100,70,.14)}
.tag.on{background:linear-gradient(180deg,#FFD166,#FFB44D);color:#fff}
/* 句型回声：空格要看得见、换词卡要大 */
.sentLine .w.blank{color:#D08A2A;background:#FFF7DE;border:2px dashed #E8AE55;border-radius:12px;padding:0 .3em;min-width:1.5em;text-align:center}
.modeTip{display:none}
/* 新手指引（只在第一次打开出现） */
.tourMask{position:fixed;inset:0;background:rgba(60,40,30,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:3vh 3vw}
.tourCard{width:min(720px,96vw);max-height:88vh;overflow-y:auto;background:#FFFDF4;border-radius:22px;padding:3.4vh 3vw;box-shadow:0 18px 44px rgba(80,50,30,.28);display:flex;flex-direction:column;gap:1.4vh}
.tourRow{display:flex;flex-direction:column;gap:.3vh;text-align:left}
.tourT{font-weight:900;font-size:clamp(15px,1.7vw,20px);color:#7A4E2E}
.tourD{font-size:clamp(13px,1.45vw,17px);line-height:1.55;color:#6E5A48}
.wordPick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4vh 1vw;width:100%;max-width:680px;margin:0 auto}
.pickWord{font-weight:900;font-size:clamp(18px,2.1vw,27px);text-align:center;padding:1.4vh .4vw;border-radius:16px;background:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(160,120,80,.22),inset 0 2px 6px rgba(255,255,255,.9)}
.pickWord:active{transform:translateY(3px)}
/* ===== 家长周报 P06 ===== */
.rpWrap{width:min(1080px,94vw);max-height:84vh;display:flex;flex-direction:column;gap:1.4vh;overflow-y:auto;padding:3vh 3vw 10vh;border-radius:var(--r);scrollbar-width:none}
.rpWrap::-webkit-scrollbar{display:none}
.rpCard{padding:2vh 1.8vw;border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 8px 20px rgba(140,100,70,.12)}
.rpWrap .rpCard{padding:1.7vh 1.6vw}
.rpWrap{gap:1.1vh}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.6vh 1vw;font-size:clamp(13px,1.4vw,17px)}
.kv b{font-weight:900}
/* ===== 预习 P08 ===== */
.pvCard{width:min(900px,90vw);padding:3vh 2vw;display:flex;flex-direction:column;align-items:center;gap:2vh}
.pvImg{width:clamp(200px,34vh,340px);height:clamp(200px,34vh,340px);border-radius:26px;background:#FFFEF9 center/contain no-repeat;box-shadow:inset 0 0 0 4px #fff,0 12px 30px rgba(140,100,70,.2)}
.timer{font-weight:900;color:#D9724F;font-size:clamp(15px,1.8vw,20px)}
/* ===== 通用浮层 ===== */
.mask{position:fixed;inset:0;background:rgba(90,60,40,.36);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{width:min(680px,88vw);padding:3vh 2.4vw;border-radius:24px;background:var(--cream);box-shadow:0 20px 50px rgba(80,50,30,.3);display:flex;flex-direction:column;gap:1.6vh;align-items:center;text-align:center}
.sugar{position:fixed;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:30;background:radial-gradient(circle at 35% 30%,#fff,#FFB44D)}
/* 连击提示 */
.combo{position:fixed;left:50%;top:24%;z-index:92;padding:.45em 1.2em;border-radius:999px;background:linear-gradient(180deg,#FFD166,#FF8A3D);color:#fff;font-weight:900;font-size:clamp(20px,3vw,38px);text-shadow:0 2px 4px rgba(140,60,0,.35);box-shadow:0 12px 28px rgba(220,120,40,.35);pointer-events:none;animation:comboIn .9s ease-out forwards}
@keyframes comboIn{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1;transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-28px) scale(.95)}}
.hidden{display:none!important}
.foot{position:fixed;left:50%;right:auto;transform:translateX(-50%);bottom:calc(1.6vh + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:.7vw;z-index:6;max-width:94vw;padding:.9vh 1.6vw;border-radius:999px;background:rgba(255,250,242,.93);box-shadow:0 8px 22px rgba(120,85,55,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.footBtn{background:rgba(255,255,255,.8);border-radius:999px;padding:.5em 1.1em;font-weight:800;font-size:clamp(12px,1.25vw,15px);box-shadow:0 4px 12px rgba(140,100,70,.16);cursor:pointer;border:none;font-family:inherit;color:var(--cocoa);white-space:nowrap}
.footBtn.on{background:linear-gradient(180deg,#FFD166,#FFB44D);color:#fff}
/* ===== 撤销提示条 ===== */
.undoToast{position:fixed;left:50%;transform:translateX(-50%);bottom:12vh;z-index:88;display:flex;align-items:center;gap:.9em;padding:.7em 1.1em;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 10px 26px rgba(120,85,55,.22);font-weight:800;font-size:clamp(13px,1.4vw,17px);color:var(--cocoa);animation:undoIn .18s ease-out}
.undoBtn{border:none;font-family:inherit;font-weight:900;font-size:inherit;padding:.35em .9em;border-radius:999px;background:linear-gradient(180deg,#FFD166,#FFB44D);color:#7A4B12;cursor:pointer}
@keyframes undoIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* ===== 小屏适配（手机竖屏 / 窄窗口）===== */
@media (max-width:760px){
  /* 关键：手机上内容经常比一屏高。原来 .wrap 是居中 + body 禁止滚动，
     超出部分被裁掉、上下互相压住，看着就是“文字和图叠在一起”。
     手机档改成从顶部排 + 整页可滚动，并给顶栏/底栏留出安全区。 */
  .wrap{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-top:calc(12vh + env(safe-area-inset-top));
    padding-bottom:calc(14vh + env(safe-area-inset-bottom))}
  /* 面板原来按内容撑宽，标题一长就超出屏幕、右侧被裁掉 */
  .panel{max-width:94vw;min-width:0;overflow-x:hidden}
  .h1{font-size:clamp(17px,4.8vw,24px);line-height:1.25;overflow-wrap:anywhere}
  .h2{font-size:clamp(15px,4.2vw,20px);overflow-wrap:anywhere}
  .mut,.chip{overflow-wrap:anywhere}
  .topbar{flex-wrap:wrap;gap:6px;align-items:flex-start}
  .topbar .h2{font-size:clamp(15px,4.4vw,20px)}
  .starStr,.slotRow{padding:.28em .6em}
  .starMini{width:14px;height:14px}
  .campGrid{grid-template-columns:1fr;width:94vw;max-height:none}
  .optGrid{grid-template-columns:repeat(2,1fr)}
  .cardGrid{grid-template-columns:repeat(4,minmax(0,1fr));max-height:none;overflow:visible;flex-shrink:0}
  .drillGrid{grid-template-columns:repeat(4,minmax(0,1fr));max-height:44vh;overflow-y:auto;flex-shrink:0}
  .sayRow{flex-wrap:wrap}
  .sayBtn{min-height:52px;font-size:clamp(15px,4.2vw,18px)}
  .rpWrap{width:94vw;max-height:none;padding:2.6vh 4vw;overflow:visible;flex-shrink:0}
  .resWrap{max-height:none;overflow:visible;flex-shrink:0}
  .stepRow{flex-wrap:wrap}
  .foot{flex-wrap:nowrap;gap:1.2vw;padding:.9vh 2vw}
  .foot .footBtn{flex:0 0 auto;padding:.5em .8em;font-size:clamp(12px,3.2vw,15px)}
  .duck.campDuck{display:none}
  .jellyGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1vh 2vw;max-height:none}
  .qCard{max-height:none}
  .qImg{width:clamp(140px,34vw,200px);height:clamp(140px,34vw,200px)}
  .duck{width:clamp(46px,13vw,62px);right:2px;top:-10px}
  .tag{font-size:13.5px;padding:.55em 1.1em}
  .row{flex-wrap:wrap;justify-content:center}
  .chip{max-width:100%}
  /* 12 个单元小方块在手机上原本横向溢出、左边 U1/U2 被切掉，改为换行 */
  .unitStrip{flex-wrap:wrap;justify-content:center;width:100%;flex-shrink:0;overflow:visible;gap:2vw 1.6vw}
  .uChip{padding:.5em .8em;font-size:13px}
}
/* 窄手机（≤430px）：4 列词卡挤到 ~80px，图看不清，降到 3 列 */
@media (max-width:430px){
  .cardGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wordPick{grid-template-columns:repeat(2,minmax(0,1fr));gap:1vh 2.4vw}
  .pickWord{font-size:clamp(17px,4.8vw,23px);padding:1.2vh .3vw;overflow-wrap:anywhere}
  .tourMask{padding:2vh 3vw}
  .tourCard{padding:2.6vh 4vw;max-height:92vh}
  .drillGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .h1{font-size:clamp(16px,5.2vw,20px)}
  .btn{padding:.8em 1.5em;font-size:clamp(15px,4.4vw,18px)}
  .chip{font-size:clamp(12px,3.6vw,15px)}
}
/* 中间档：平板竖屏 / 小窗口，9 列会小到点不准，降到 6 列 */
@media (min-width:761px) and (max-width:1180px){
  .cardGrid{grid-template-columns:repeat(6,minmax(0,1fr));max-height:none;overflow:visible;flex-shrink:0}
  .drillGrid{grid-template-columns:repeat(6,minmax(0,1fr));max-height:48vh;overflow-y:auto;flex-shrink:0}
  .jellyGrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  /* 平板竖屏内容比一屏高时也会被居中裁掉，这里同样允许整页滚动 */
  .wrap{overflow-y:auto;justify-content:flex-start;padding-top:calc(8vh + env(safe-area-inset-top));padding-bottom:calc(12vh + env(safe-area-inset-bottom))}
  .panel{max-width:94vw;min-width:0}
}
/* 横屏平板：宽度 >1180 时原来沿用桌面“居中 + 禁止滚动”，
   营地右侧“我的收藏”和底部按钮会掉到固定底栏下面，手指也划不动。
   横屏统一改成可滚动 + 底部留出底栏高度。 */
@media (orientation:landscape) and (max-height:980px){
  .wrap{overflow-y:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch;
    padding-top:calc(9vh + env(safe-area-inset-top));
    padding-bottom:calc(16vh + env(safe-area-inset-bottom))}
  .campGrid{max-height:none;align-content:start}
  .dueCard{overflow:visible}
  .panel{max-height:none}
  .rpWrap{max-height:none;overflow:visible;flex-shrink:0}
  /* 右侧四张卡在横屏里整体压扁一点，让“我的收藏”在首屏就露出底栏上方 */
  .campGrid > .col{gap:.9vh}
  .campGrid > .col > .panel{padding:1.3vh 1.4vw !important}
}
@media (max-height:520px){
  .cardGrid{max-height:48vh}
  .panel{padding:2vh 3vw}
}
/* ===== 营火（5 级） ===== */
.firePanel{display:flex;flex-direction:column;gap:6px}
.campfire{width:94px;height:94px;object-fit:contain;transition:transform .3s;transform-origin:50% 90%;filter:drop-shadow(0 4px 8px rgba(150,90,40,.25))}
.campfire.lv1{transform:scale(.66)}
.campfire.lv2{transform:scale(.78)}
.campfire.lv3{transform:scale(.9)}
.campfire.lv4{transform:scale(1)}
.campfire.lv5{transform:scale(1.12);filter:drop-shadow(0 0 14px rgba(255,180,90,.7))}
.fireWrap{position:relative;height:104px;margin-top:4px;display:flex;align-items:flex-end;justify-content:center}
.logs{position:absolute;bottom:2px;width:64px;height:14px;border-radius:8px;background:linear-gradient(180deg,#C8925E,#8C5A32);box-shadow:0 3px 6px rgba(90,60,30,.25)}
.fire{position:relative;bottom:8px;width:34px;height:34px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 78%,#FFF3B0 0%,#FFC94D 34%,#FF8A2B 66%,#E0561B 100%);filter:drop-shadow(0 0 6px rgba(255,160,60,.55));animation:flicker 1.6s ease-in-out infinite}
.fire.lv1{width:26px;height:26px;opacity:.75}
.fire.lv2{width:32px;height:32px;opacity:.85}
.fire.lv3{width:38px;height:38px}
.fire.lv4{width:44px;height:44px;box-shadow:0 0 14px rgba(255,190,90,.65)}
.fire.lv5{width:50px;height:50px;box-shadow:0 0 22px rgba(255,205,110,.85);background:radial-gradient(circle at 50% 78%,#FFFFFF 0%,#FFE98A 26%,#FFB93D 56%,#FF6A18 100%)}
@keyframes flicker{0%,100%{transform:scaleY(1) translateX(0)}35%{transform:scaleY(1.1) translateX(-1px)}70%{transform:scaleY(.94) translateX(1px)}}
/* ===== 果冻图鉴 ===== */
.jellyGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.2vh 1vw;width:min(92vw,900px);max-height:64vh;overflow-y:auto;padding:1vh 0}
.jellyCell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:.8vh .4vw;border-radius:14px;background:rgba(255,255,255,.55)}
.jellyBlob{width:clamp(44px,5vw,64px);height:clamp(44px,5vw,64px);border-radius:48% 52% 58% 42%/52% 46% 54% 48%;background:var(--jc);background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0%,var(--jc) 55%,rgba(120,85,55,.35) 100%);box-shadow:inset 0 -6px 10px rgba(0,0,0,.12),0 6px 14px rgba(140,100,70,.18);display:flex;align-items:center;justify-content:center}
.jellyCell.locked .jellyBlob{opacity:.42;filter:grayscale(.5)}
.jellyFace{font-size:clamp(12px,1.2vw,16px);font-weight:900;color:#6B4A2F;letter-spacing:1px}
.jellyName{font-weight:900;font-size:clamp(11px,1.15vw,14px);color:var(--cocoa);text-align:center}
.jellyHow{font-size:clamp(10px,1vw,12px);text-align:center;line-height:1.2}
.jellyPic{width:clamp(56px,6vw,72px);height:clamp(56px,6vw,72px);object-fit:contain;filter:drop-shadow(0 5px 8px rgba(120,80,50,.22))}
.jellyCell.locked .jellyPic{filter:grayscale(1) brightness(1.05) opacity(.32)}
.jellyPic.lg{width:clamp(96px,13vw,150px);height:clamp(96px,13vw,150px)}
.jellyCell.popJelly .jellyPic{animation:jellyPop .5s ease-out}
.jellyReward{display:flex;flex-direction:column;align-items:center;gap:1vh;margin:.6vh 0;padding:1.4vh 2vw;border-radius:22px;background:linear-gradient(180deg,#FFF6E2,#FFEFD2);box-shadow:0 10px 24px rgba(150,100,60,.18);border:3px solid #fff}
.jellyReward > .mut{font-weight:900;color:#8A5A2B;font-size:clamp(14px,1.6vw,18px)}
.jellyNewRow{display:flex;flex-wrap:wrap;justify-content:center;gap:2vw}
.jellyNewCard{display:flex;flex-direction:column;align-items:center;gap:.4vh;animation:jellyIn .55s cubic-bezier(.2,1.4,.4,1) both}
.jellyNewCard .jellyName{font-size:clamp(13px,1.4vw,16px)}
@keyframes jellyIn{0%{transform:scale(.4) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.jellyCell.popJelly .jellyBlob{animation:jellyPop .5s ease-out}
@keyframes jellyPop{0%{transform:scale(1)}40%{transform:scale(1.28,.86)}70%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
/* 手机档必须写在基础样式之后，否则被后面的 repeat(6) 覆盖 */
@media (max-width:760px){
  .jellyGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2vh 2vw;max-height:none}
  .jellyPic{width:clamp(64px,20vw,92px);height:clamp(64px,20vw,92px)}
  .jellyBlob{width:clamp(52px,15vw,66px);height:clamp(52px,15vw,66px)}
  .jellyName{font-size:clamp(12px,3.6vw,15px)}
  .jellyHow{font-size:clamp(11px,3.2vw,13px);overflow-wrap:anywhere;word-break:break-word}
  .v-quiz{justify-content:center}
  .miniRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw;width:100%}
  .miniRow > .h2{grid-column:1 / -1}
  .miniRow .miniCard{flex-direction:column;text-align:center;padding:1vh 1vw;gap:.6vh}
  .miniRow .thumb{width:clamp(46px,13vw,64px);height:clamp(46px,13vw,64px)}
  .miniRow .miniCard .mut{font-size:11px !important}
}
/* ===== 回声页小鸭 ===== */
.duckMini{width:clamp(22px,2.4vw,32px);height:auto;opacity:.8}
.duckLost{position:absolute;right:2px;bottom:2px;width:38%;max-width:44px;height:auto;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(90,60,30,.3))}
.wc{position:relative}
/* 路线页：圆点里的星级要压小，否则三个字塞不下、看起来只是一块橙色 */
.node .st{position:static;font-size:clamp(8px,1vw,11px);line-height:1;letter-spacing:-.06em;white-space:nowrap;color:#FFF8E7;text-shadow:0 1px 2px rgba(170,100,20,.55)}
.node.boss .st{color:#FFF3F6}
/* 翻图核对：图片“长出来”的轻动画，配合叮声 */
.snapIn{animation:snapIn .32s ease-out}
@keyframes snapIn{0%{transform:scale(.88);opacity:.4}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
/* 横屏平板：判定按钮做大，家长不用眯着眼点 */
@media (orientation:landscape) and (min-height:560px){
  .sayBtn{min-height:clamp(56px,10vh,86px);font-size:clamp(18px,2.1vw,26px);padding:1.2vh 2.4vw}
  .sayRow{gap:1.6vw}
}
/* ===== 流畅模式（平板/手机）：安卓中低端 GPU 上大模糊阴影和高斯滤镜最拖帧，这里统一减负 ===== */
@media (max-width:1180px){
  .stage{transition:none}
  .panel,.paper,.jellyReward,.tourCard,.modal{box-shadow:0 4px 12px rgba(140,100,70,.16)}
  .btn,.opt,.sayBtn,.pickWord,.chip,.miniCard,.uChip,.slotRow,.starStr,.wc,.thumb,.qImg,.pvImg,.stat,.proveCard{box-shadow:0 3px 8px rgba(140,100,70,.14)}
  .duck,.duckLost,.starBig,.jellyPic,.jellyBlob{filter:none}
  .wc.gray,.wc.half{filter:none;opacity:.85}
  .jellyCell.locked .jellyPic{filter:none;opacity:.3}
  .wc.lowink::before{box-shadow:none;background:rgba(255,220,170,.28)}
  .fire.lv4,.fire.lv5{box-shadow:none}
}
@media (max-width:760px){
  .sugar{display:none}   /* 手机端撒糖粒子省掉，答对反馈交给星星和提示音 */
}
/* 手动/自动流畅模式：去掉阴影、滤镜和粒子，只留最必要的动画 */
body.lite .panel,body.lite .paper,body.lite .jellyReward,body.lite .tourCard,body.lite .modal,
body.lite .btn,body.lite .opt,body.lite .sayBtn,body.lite .pickWord,body.lite .chip,
body.lite .miniCard,body.lite .uChip,body.lite .slotRow,body.lite .starStr,body.lite .wc,
body.lite .thumb,body.lite .qImg,body.lite .pvImg,body.lite .stat,body.lite .node,
body.lite .jellyCell{box-shadow:none !important;text-shadow:none !important}
body.lite .duck,body.lite .duckLost,body.lite .starBig,body.lite .jellyPic,body.lite .jellyBlob{filter:none !important}
body.lite .stage{transition:none !important}
body.lite .sugar{display:none !important}
body.lite .combo,body.lite .undoToast{animation:none !important}
.echoDuck{width:clamp(110px,14vh,170px);height:auto;align-self:center;filter:drop-shadow(0 8px 14px rgba(170,120,80,.28))}
.emptyEcho{width:min(640px,92vw);padding:4vh 3vw;align-items:center;text-align:center}
.emptyEcho .btn{margin-top:1.2vh}
.leadLetter{color:#E4761B;text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.1em}
</style>

<body>
<div class="stage" id="stage"></div>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<script>

function todayStr(d) { d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseD(s) { const [y, m, dd] = s.split('-').map(Number); return new Date(y, m - 1, dd); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return todayStr(d); }
function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 864e5); }
function rnd(seed) { let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
function shuffle(arr, seed) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(seed + i * 7) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= 存档 ================= */
const KEY = 'zmS3_camp_v1';
function defState() {
  return { v: 1, start: '2026-11-02', holidays: [14, 15, 26, 48], stars: {}, mastery: {}, echo: [], stickers: [], badges: [], stamps: {}, intern: false, fire: 0, jelly: [], rescued: 0, tour: false, sentGuide: false, lite: null, lastOpen: '', lastBackup: '', logs: [], meas: [], drill: null, onlyLearned: true, lag: 0, sight: [], sentRot: {} };
}
let S = defState();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defState(), JSON.parse(raw)); } catch (e) { S = defState(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
/* 旧档补发：U1 已有星星、但还没拿到“起步果冻”的，自动补一只（v1.4 起 U1 门槛降为 1 星） */
function migrate() {
  if (!S.jelly.includes('u01') && Object.keys(S.stars || {}).some(k => k.indexOf('u01_') === 0)) {
    S.jelly.push('u01'); save();
  }
}
/* 流畅模式：低配设备自动简化阴影/滤镜；家长也可以在设置里强行开或关 */
function applyLite() {
  const auto = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3;
  const on = S.lite == null ? auto : !!S.lite;

  window.LITE_ON = on;
}
/* 家长判定快捷键：答题页按 1=说出来了 / 2=提示后 / 3=没说（仅当页面上有判定按钮时生效） */
function bindQuizKeys() {

    if (e.key < '1' || e.key > '3') return;

/* ================= 日历 ================= */
function weekNo(dateStr) { return Math.floor(daysBetween(S.start, dateStr) / 7) + 1; }
function isHoliday(w) { return S.holidays.includes(w); }
function kOf(w) { let off = 0; for (const h of S.holidays) if (h < w) off++; return w - off; }
function unitOfK(k) { return Math.min(12, Math.max(1, Math.ceil(k / 4))); }
function weekInUnit(k) { return ((k - 1) % 4) + 1; }
const U = n => DATA.units[n - 1];
function unitKey(n) { return 'u' + String(n).padStart(2, '0'); }

/* ================= 掌握度 ================= */
function mGet(id) { return (S.mastery[id] && S.mastery[id].m) || 0; }
function mSet(id, c, dateStr) {
  const old = S.mastery[id];
  const base = old ? old.m : 0;
  const nm = Math.max(0, Math.min(100, Math.round(base + 0.30 * (100 * c - base))));
  S.mastery[id] = { m: nm, last: dateStr || todayStr() };
  return [base, nm];
}
function decay(now) {
  if (S.lastOpen === now) return false;
  for (const id in S.mastery) {
    const rec = S.mastery[id];
    if (!rec.last) continue;
    const gap = daysBetween(rec.last, now);
    if (gap > 7) rec.m = Math.max(0, rec.m - 4 * (gap - 7));
  }
  S.lastOpen = now; save(); return true;
}
function wordState(m) { return m < 1 ? 'gray' : m < 70 ? 'half' : m < 90 ? 'full' : 'gold'; }
/* 给孩子看的档位文字，替代 0/51/83 这种分数 */
function stateText(m) { return m < 1 ? '还没练' : m < 40 ? '练过一次' : m < 70 ? '有点印象' : m < 90 ? '快熟了' : '很熟'; }

/* ================= 组卷 ================= */
function arrayOfWeek(u, wi) { const w = U(u).words; return w.slice((wi - 1) * 9, wi * 9); }
/* 当天最多能出到本周第几个词：周一 3、周二 6、周三之后 9 */
function dayCap(dk) { return dk === 'D1' ? 3 : dk === 'D2' ? 6 : 9; }
/* 某个单元的哪些词“现在可以看/可以考”：词卡页、复习勾选、出题都用它，
   避免周一就看到周三才教的新词 */
function visibleWords(u, dk) {
  const cap = dayCap(dk), lw = learnedWeek();
  return U(u).words.map((w, i) => ({ w, i })).filter(({ i }) => {
    if (!S.onlyLearned) return true;
    const gw = (u - 1) * 4 + Math.floor(i / 9) + 1;
    if (gw > lw) return false;                      // 还没教到的周
    if (gw === lw) return i % 9 < cap;              // 本周还没到那天的词
    return true;                                    // 以前的周：都学过
  });
}

function buildSession(u, wi, dk) {
  const unit = U(u);
  const weekWords = arrayOfWeek(u, wi);
  const words = unit.words;
  const seed = u * 1000 + wi * 10 + DAYS.findIndex(d => d.k === dk) + weekNo(todayStr()) + (S.logs ? S.logs.length : 0);
  /* 只出已学过的词：既按“周”过滤，也按“星期几”过滤。
     D1 只到本周前 3 个词、D2 到前 6 个、D3 才放开 9 个——否则周一一开局就会抽到周三才教的词。 */
  const unitWeek = (u - 1) * 4 + wi;
  const capNow = dayCap(dk);
  const capIdx = unitWeek >= learnedWeek() ? capNow : 9;   // 本周还没学完就按天卡住；已经学过的旧周全放
  const scoped = weekWords.slice(0, capIdx);
  const allowed = scoped.filter(w => wordLearned(u, w));
  const usable = allowed.length ? allowed : scoped;
  let targets = [];
  if (dk === 'D1') targets = usable.slice(0, 3);
  if (dk === 'D2') targets = usable.slice(3, 6);
  if (dk === 'D3') targets = usable.slice(6, 9);
  if (dk === 'D4') targets = usable.slice().sort((a, b) => mGet(idOf(u, a)) - mGet(idOf(u, b))).slice(0, 3);
  if (dk === 'D5') targets = shuffle(usable, seed).slice(0, 3);   // 周五总结：本周随机抽 3
  if (dk === 'D6') targets = shuffle(usable, seed).slice(0, 3);   // 周六加练
  const qs = [];
  // 3 道 T3 看图说词（弱项：概念 -> 词）
  targets.forEach(w => qs.push({ t: 'T3', word: w, id: idOf(u, w) }));
  // 2 道 T4 看词读出来（弱项：形 -> 音；先读，后翻图核对）
  const others = scoped.filter(w => !targets.includes(w) && wordLearned(u, w));
  // 跨周兜底时也要排掉“本周还没到那天”的词，别把明天的新词混进来
  const learnedPool = words.filter((w, idx) => !targets.includes(w) && wordLearned(u, w) &&
    !(Math.floor(idx / 9) + 1 === wi && idx % 9 >= capIdx));
  // 最后的兜底只用“今天及以前”的词，宁可和 T3 重复，也不把明天的新词提前放出来
  const t4pool = others.length >= 2 ? others : (learnedPool.length ? learnedPool : usable);
  const t4a = shuffle(t4pool, seed + 1)[0];
  const t4b = shuffle(t4pool.filter(w => w !== t4a), seed + 2)[0];
  [t4a, t4b].forEach(w => { if (w) qs.push({ t: 'T4', word: w, id: idOf(u, w) }); });
  // 1 道拼读
  const groups = unit.phonics;
  const gi = (wi * 2 + DAYS.findIndex(d => d.k === dk)) % groups.length;
  const g = groups[gi];
  const target = shuffle(g.w, seed + 5)[0];
  // 干扰项也只用“今天及以前”的词，避免选项里冒出还没教的生词
  const seenPool = words.slice(0, (wi - 1) * 9 + capIdx);
  const distract = shuffle(seenPool.filter(w => !g.w.includes(w)), seed + 6).slice(0, Math.max(0, 3 - g.w.length));
  qs.push({ t: 'T5', badge: g.b, word: target, id: idOf(u, target),
    options: shuffle(g.w.concat(distract), seed + 7).slice(0, 3) });
  return { u, wi, dk, qs, key: `${unitKey(u)}_w${wi}_${dk}` };
}

function idOf(u, w) { const unit = U(u); const i = unit.words.indexOf(w); return `${unitKey(u)}_${pad3(i + 1)}`; }

/* 词属于「第几周」（全局课次周：U1W1=1 … U12W4=48） */
function weekIdxOf(u, w) {
  const i = U(u).words.indexOf(w);
  if (i < 0) return 999;
  return (u - 1) * 4 + Math.floor(i / 9) + 1;
}
/* 已学到第几周：日历周次 - 家长设置的落后周数 */
function learnedWeek() { return kOf(weekNo(todayStr())) - (S.lag || 0); }
/* 开关关掉时一律放行 */
function wordLearned(u, w) {
  if (!S.onlyLearned) return true;
  return weekIdxOf(u, w) <= learnedWeek();
}

/* 家长勾选复习清单 → 6 题小局（3 看图说词 + 3 看词读），不评星、不入营 */
function buildDrill(u, words) {
  const list = words && words.length ? words.slice(0, 36) : [];
  const qs = [];
  for (let i = 0; i < 6 && list.length; i++) {
    const w = list[i % list.length];
    qs.push({ t: (i % 2 === 0 ? 'T3' : 'T4'), word: w, id: idOf(u, w) });
  }
  return { u, wi: 0, dk: 'DR', qs, key: 'drill_' + unitKey(u), drill: true };
}

/* ================= 判定与结算 ================= */
let SES = null, QI = 0, RES = [];
function credit(code) { return code === 'ok' ? 1 : code === 'hint' ? 0.5 : 0; }
function ceilStars(a, n) { return { s3: Math.ceil(0.8 * n), s2: Math.ceil(0.55 * n), s1: Math.ceil(0.35 * n) }; }

function finishSession() {
  const n = 5; // 星级只看 5 个词位
  let A = 0, sum = 0, phOk = true;
  RES.forEach((r, i) => {
    const q = SES.qs[i];
    const c = credit(r.code);
    sum += c;
    if (q.t !== 'T5') { if (r.code === 'ok') A++; }
    else { if (r.code !== 'ok') phOk = false; }
  });
  const th = ceilStars(0, n);
  const stars = A >= th.s3 ? 3 : A >= th.s2 ? 2 : A >= th.s1 ? 1 : 0;
  const now = todayStr();
  // 掌握度写入
  const changes = [];
  RES.forEach((r, i) => {
    const q = SES.qs[i];
    const [o, nm] = mSet(q.id, credit(r.code), now);
    changes.push({ word: q.word, o, n: nm, c: credit(r.code) });
  });
  // 错题回声：救回一只 -> 从回声里移走并累计“救回数”
  let rescued = 0;
  const echoBefore = S.echo.map(e => e.id);
  RES.forEach((r, i) => {
    const q = SES.qs[i];
    if (r.code !== 'ok') {
      const ex = S.echo.find(e => e.id === q.id);
      if (ex) { ex.n++; } else S.echo.push({ id: q.id, u: SES.u, w: q.word });
    } else {
      if (echoBefore.indexOf(q.id) >= 0) rescued++;
      S.echo = S.echo.filter(e => e.id !== q.id);
    }
  });
  if (rescued) S.rescued = (S.rescued || 0) + rescued;
  // 星级存档（取历史最好）——复习清单小局不计星
  const isDrill = !!SES.drill;
  const isEcho = !!SES.isEcho;
  if (!isDrill && !isEcho) {
    const prev = S.stars[SES.key];
    S.stars[SES.key] = { stars: Math.max(stars, prev ? prev.stars : 0), A, ts: now };
  }
  // 拼读印章：本周 3 次拼读位全对
  if (phOk && !isDrill && !isEcho) {
    const wk = unitKey(SES.u) + '_w' + SES.wi;
    S.stamps[wk] = (S.stamps[wk] || 0) + 1;
  }
  // 贴纸：周六关结算时，本周 ≥3 天
  let gotSticker = null;
  if (SES.dk === 'D6') {
    const wk = unitKey(SES.u) + '_w' + SES.wi;
    const cnt = DAYS.filter(d => S.stars[wk + '_' + d.k]).length;
    if (cnt >= 3) {
      const gold = cnt >= 5;
      const ex = S.stickers.find(s => s.wk === wk);
      if (!ex) { S.stickers.push({ wk, gold, ts: now }); gotSticker = { gold }; }
    }
  }
  // 徽章：第 4 周周六关（Boss）1 星以上
  let gotBadge = null;
  if (SES.wi === 4 && SES.dk === 'D6' && stars >= 1) {
    const uk = unitKey(SES.u);
    if (!S.badges.includes(uk)) { S.badges.push(uk); gotBadge = uk; }
  }
  // 见习章：新档第一周任意一关拿到 2 星，当场发（单独字段，不占 12 枚营地徽章）
  let gotIntern = false;
  if (!S.intern && !isDrill && SES.wi === 1 && stars >= 2) { S.intern = true; gotIntern = true; }
  // 本周 3 天刚凑齐：当天就告诉孩子“格子满了”，正式贴纸仍周六发
  let weekFullNow = false;
  if (!isDrill) {
    const wk = unitKey(SES.u) + '_w' + SES.wi;
    const cnt = DAYS.filter(d => S.stars[wk + '_' + d.k]).length;
    if (cnt === 3 && !S.stickers.find(s => s.wk === wk)) weekFullNow = true;
  }
  // 营火：每完成一关添一根柴（复习/救鸭不算），6 根升 1 级，共 5 级
  const fireBefore = S.fire || 0;
  let fireUp = 0;
  if (!isDrill && !isEcho) S.fire = Math.min(30, fireBefore + 1);
  const lv = f => Math.min(5, Math.floor(f / 6) + 1);
  if (lv(S.fire) > lv(fireBefore)) fireUp = lv(S.fire);
  // 果冻图鉴：单元内第一次拿到三星，掉一只普通果冻
  // U1 作为起步单元降低门槛（任意 1 星），让孩子第一天就能点亮一格
  let jellyNew = null;
  if (!isDrill && !isEcho) {
    const need = SES.u === 1 ? 1 : 3;
    if (stars >= need) {
      const uk = unitKey(SES.u);
      if (!S.jelly.includes(uk)) { S.jelly.push(uk); jellyNew = uk; }
    }
  }
  // 稀有果冻三个：营火满级 / 累计救回 10 只小鸭 / 拿到金边贴纸
  const rareNow = [];
  const give = id => { if (!S.jelly.includes(id)) { S.jelly.push(id); rareNow.push(id); } };
  if (lv(S.fire) === 5) give('rare_fire');
  if ((S.rescued || 0) >= 10) give('rare_rescue');
  if (S.stickers.some(s => s.gold)) give('rare_gold');
  S.logs.push({ key: SES.key, stars: (isDrill || isEcho) ? null : stars, A, sum, ts: now, drill: isDrill });
  save();
  const mins = Math.max(1, Math.round((Date.now() - (SES.t0 || Date.now())) / 60000));
  /* 实测记录：独立完成率 / 专注时长 / 中途离开次数 */
  const away = SES.away || 0;
  const nq = SES.qs.filter(q => q.t !== 'T5').length || 5;
  const indep = Math.round(A / nq * 100);
  S.meas = S.meas || [];
  S.meas.push({ ts: now, key: SES.key, drill: isDrill, mins, indep, away, stars: (isDrill || isEcho) ? null : stars, a: A, nq: nq });
  if (S.meas.length > 60) S.meas = S.meas.slice(-60);
  save();
  return { stars, A, sum, n: 6, nq, changes, gotSticker, gotBadge, gotIntern, weekFullNow, phOk, mins, indep, away, drill: isDrill, isEcho, rescued, jellyNew, fireUp, newRares: rareNow, fireLevel: lv(S.fire) };
}

/* 中途切走算一次分心：答题中离开超过 8 秒才记一次 */
let HIDDEN_TS = 0;
function trackAway() {
  document.addEventListener('visibilitychange', () => {
    if (typeof VIEW === 'undefined' || VIEW !== 'quiz' || !SES || !SES.qs) return;
    if (document.hidden) { HIDDEN_TS = Date.now(); return; }
    if (HIDDEN_TS && Date.now() - HIDDEN_TS >= 8000) SES.away = (SES.away || 0) + 1;
    HIDDEN_TS = 0;
  });
}

/* ================= 单元掌握度 ================= */function unitMastery(u) {
  const unit = U(u);
  const uk = unitKey(u);
  // 逐周累加：完成某周任一关即解锁该周 9 词 + 该周拼读组
  let W = 0, sum = 0, ids = [];
  for (let wi = 1; wi <= 4; wi++) {
    const wkDone = DAYS.some(d => S.stars[uk + '_w' + wi + '_' + d.k]);
    if (!wkDone) continue;
    arrayOfWeek(u, wi).forEach(w => { ids.push([idOf(u, w), 1.0]); });
    const g = unit.phonics[(wi * 2) % unit.phonics.length];
    ids.push([uk + '#ph#' + g.b, 1.0]);
  }
  ids.forEach(([id, wt]) => { sum += wt * mGet(id); W += wt; });
  return W ? Math.round(sum / W) : 0;
}

/* ================= 声音 ================= */
let VOICE = null;
function initVoice() {
  if (!window.speechSynthesis || !speechSynthesis.getVoices) return;
  const pick = () => {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /en[-_]US/i.test(v.lang) && /female|Samantha|Zira|Google US/i.test(v.name)) || vs.find(v => /en/i.test(v.lang)) || null;
  };
  pick(); speechSynthesis.onvoiceschanged = pick;
}
/* 系统发音兜底专用：有的手机 TTS 会把单独一个 a 念成字母名 /eɪ/，也会把 the 念成 /ðiː/。
   这里只在“没有 mp3、退回系统发音”时把冠词换成能稳定读成弱读的说法，屏幕上的英文不动。 */
function speechText(t) {
  return String(t)
    .replace(/\bthe\b/gi, 'thuh')
    .replace(/\ba\b/g, 'uh')
    .replace(/\ban\b/g, 'un');
}
function say(text, rate) {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.86; u.pitch = 1.06;
    if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
  } catch (e) { }
}
/* 拼读位用：把单词拆成字母逐个念（b, e, l, l），帮不会读整词的孩子先听字母 */
function sayLetters(w) {
  const letters = String(w || '').replace(/[^A-Za-z]/g, '').split('');
  if (!letters.length) return;
  say(letters.join(', '), 0.5);
}

/* 播本地音频（assets/audio/words/uXX_001.mp3）；没有文件就退回系统发音 */
let CUR_AUDIO = null;
let AUDIO_SEQ = 0;
let PAGE_SEQ = 0;
/* 任何页面切换、下一题、离开句型页都调用它：掐掉正在播的音，避免“图换了音还在” */
function stopAudio() {
  AUDIO_SEQ++;
  if (CUR_AUDIO) {
    const a = CUR_AUDIO; CUR_AUDIO = null;
    try { a.onended = null; a.onerror = null; a.pause(); } catch (e) { }
    // 把音源掐掉：只 pause 的话，网络慢时 play() 的 Promise 晚到还会把上一题的词放出来
    try { a.removeAttribute('src'); a.load(); } catch (e) { }
  }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { }
}
/* 带页面令牌的延迟动作：换页/换题后令牌变了，这次播放直接作废，避免“图换了音还在” */
function laterOnPage(fn, ms) {
  const ps = PAGE_SEQ;
  setTimeout(() => { if (ps === PAGE_SEQ) fn(); }, ms);
}
/* 图片预加载：把后面几页要用的图提前拉下来，切页不用干等 */
const PRE_IMG = {};
function preloadImg(src) {
  if (!src || PRE_IMG[src]) return;
  const im = new Image();
  im.decoding = 'async';
  im.src = src;
  PRE_IMG[src] = im;
}
/* 进入游戏后空闲时把 9 张背景预热（一张一张来，避免开机瞬间一起解码造成卡顿） */
function warmBgs() {
  const list = Object.keys(BG).map(k => BG[k]);
  let i = 0;
  const tick = () => {
    if (i >= list.length) return;
    preloadImg(list[i++]);
    setTimeout(tick, 220);
  };
  setTimeout(tick, 1600);
}
/* 音频预加载：句型连读前先把整句每个词的 mp3 拉到本地，避免最后一个词“慢半拍” */
const PRE_AUDIO = {};
function preloadAudio(src) {
  if (!src || PRE_AUDIO[src]) return PRE_AUDIO[src];
  try { const a = new Audio(); a.preload = 'auto'; a.src = bob(src); PRE_AUDIO[src] = a; return a; } catch (e) { return null; }
}
function sayAudio(path, fallbackText, rate, cb) {
  const done = typeof cb === 'function' ? cb : () => { };
  try {
    if (CUR_AUDIO) { CUR_AUDIO.pause(); CUR_AUDIO = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const a = new Audio(bob(path));
    CUR_AUDIO = a;
    a.onended = () => done();
    a.onerror = () => { say(fallbackText, rate); setTimeout(done, Math.max(500, String(fallbackText).length * 90 + 400)); };
    const p = a.play();
    if (p && p.catch) p.catch(() => { say(fallbackText, rate); setTimeout(done, Math.max(500, String(fallbackText).length * 90 + 400)); });
  } catch (e) { say(fallbackText, rate); setTimeout(done, 700); }
}
function sayWord(id, word, rate, cb) {
  sayAudio(`assets/audio/words/${id}.mp3`, word, rate, cb);
}
/* 句型例句音频：uXX_sNN.mp3，NN = 该单元内例句的连续序号（p1 第1例=01） */
const pad2 = n => String(n).padStart(2, '0');
function sentNo(unit, gi, ei) {
  let k = 0;
  for (let i = 0; i < gi; i++) k += (unit.sentences[i].ex || []).length;
  return k + ei + 1;
}
function saySent(u, gi, ei, text, rate) {
  const path = `assets/audio/sent/${unitKey(u)}_s${pad2(sentNo(U(u), gi, ei))}.mp3`;
  sayAudio(path, speechText(text), rate || 0.82);
}
/* 词不在本单元词表里时：先找句型常用词的小音频（the / a / it / is / can…），
   保证和词卡是同一个声音；再没有才退回系统发音。 */
function sayWordIn(u, w, rate, cb) {
  const unit = U(u);
  const clean = String(w).replace(/[^A-Za-z']/g, '');   // 句子里带句号/逗号，去掉再查词表，尽量用词表里的真人音
  const i = unit.words.indexOf(clean);
  if (i < 0) {
    const key = clean.toLowerCase().replace(/[^a-z0-9]/g, '');
    const p = `assets/audio/sentwords/${key}.mp3`;
    sayAudio(p, speechText(clean), rate, cb);
    return;
  }
  sayWord(`${unitKey(u)}_${pad3(i + 1)}`, clean, rate, cb);
}
let AC = null;
function blip(kind) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = 'sine';
    const f = kind === 'ok' ? 720 : kind === 'hint' ? 520 : 300;
    o.frequency.value = f; g.gain.value = 0.08;
    o.start(); o.frequency.exponentialRampToValueAtTime(f * 1.35, AC.currentTime + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.22);
    o.stop(AC.currentTime + 0.24);
  } catch (e) { }
}
function sugarBurst(x, y) {
  if (window.innerWidth <= 760) return;   // 手机端跳过粒子动画，避免小机器掉帧
  for (let i = 0; i < 5; i++) {
    const d = el('div', 'sugar');
    d.style.left = (x + (Math.random() - .5) * 90) + 'px';
    d.style.top = (y + (Math.random() - .5) * 60) + 'px';
    document.body.appendChild(d);
    const dx = (Math.random() - .5) * 220, dy = -60 - Math.random() * 120;
    d.animate([{ transform: 'translate(0,0) scale(.4)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: 0 }], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.6,.3,1)' });
    setTimeout(() => d.remove(), 1200);
  }
}

function todayTargets(u, wi, dk) {
  const wk = arrayOfWeek(u, wi);
  if (dk === 'D1') return wk.slice(0, 3);
  if (dk === 'D2') return wk.slice(3, 6);
  if (dk === 'D3') return wk.slice(6, 9);
  if (dk === 'D4') return wk.slice().sort((a, b) => mGet(idOf(u, a)) - mGet(idOf(u, b))).slice(0, 3);
  return shuffle(wk, wi + 9).slice(0, 3);
}
function nextSession(c) {
  const idx = DAYS.findIndex(d => d.k === c.dk);
  if (idx >= 0 && idx < DAYS.length - 1 && c.now === todayStr()) {
    return { name: DAYS[idx + 1].name, desc: `明天见，${DAYS[idx + 1].k === 'D6' ? '本周 9 词总检 + 上周错题回声' : '当天新学的 3 个词'}` };
  }
  const nx = addDays(c.now, 1);
  return { name: '明天 · ' + nx, desc: '打开时按日历自动排' };
}

    rowH4.appendChild(el('div', 'mut', '先读，再翻图听音核对'));
    const bH4 = el('button', 'btn sm ghost', '怎么判？');
    bH4.onclick = openJudgeGuide;

  if (q.t === 'T5') {

      rb.classList.add('ok');
      rb.style.boxShadow = '0 0 0 3px rgba(255,190,80,.75)';

      setTimeout(() => answer(code, rb), 900);

        // 点错：排掉这一项

          autoPickLast(live[0], wrong >= 2 ? 'no' : 'hint');

        }
        if (wrong >= 2) {                // 两次都点错＝没认出，按「没说」记（T5 不计星）
          answer('no', b);

/* 家长误点兜底：每题记完 3 秒内可撤销（含最后一题——整局成绩一起回滚） */
let UNDO = null;
function showUndo(code, qi, snap, finished) {
  const old = document.getElementById('undoToast');
  if (old) old.remove();
  const label = code === 'ok' ? '说出来了' : code === 'hint' ? '提示后' : '没说';
  const box = el('div', 'undoToast');
  box.id = 'undoToast';
  box.appendChild(el('span', '', `上一题记为「${label}」`));
  const b = el('button', 'undoBtn', '撤销');
  b.onclick = () => {
    box.remove();
    const u = UNDO; UNDO = null;
    if (!u) return;
    if (u.finished) {                       // 整局已结算 → 回滚存档再回到最后一题
      S = JSON.parse(JSON.stringify(u.snap));
      save();
      QI = u.qi; RES = RES.slice(0, u.qi);
      go('quiz');
    } else {
      QI = u.qi; RES = RES.slice(0, u.qi);
      render();
    }
  };
  box.appendChild(b);
  document.body.appendChild(box);
  UNDO = { qi, snap, finished };
  setTimeout(() => { if (box.parentNode) box.remove(); if (UNDO && UNDO.qi === qi) UNDO = null; }, 3000);
}

/* 连击提示：连对 3/5/8 题时闪一下，不打断答题 */
function showCombo(n) {
  const t = el('div', 'combo', `连对 ${n} 题！`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 950);
}

function answer(code, node) {
  const q = SES.qs[QI];
  const snap = JSON.parse(JSON.stringify(S));   // 撤销用的存档快照
  const qiNow = QI;
  RES[QI] = { code };
  if (code === 'ok') {
    SES.fails = 0;
    SES.combo = (SES.combo || 0) + 1;
    if (SES.combo === 3 || SES.combo === 5 || SES.combo === 8) showCombo(SES.combo);
    node.classList.add('ok'); blip('ok'); sugarBurst(window.innerWidth / 2, window.innerHeight / 2);
  }
  // hint 不清零 fails：用过提示不该把“听音防猜”的防护重新关掉，防护开了本局就保持
  else if (code === 'hint') { SES.combo = 0; node.classList.add('no'); blip('hint'); }
  else {
    SES.fails++;
    SES.combo = 0;
    node.classList.add('no'); blip('no');
    // 给出正确答案
    const card = node.closest('.qCard');
    const tip = el('div', 'mut', `答案是：<b>${q.word}</b>`);
    card.appendChild(tip);
    laterOnPage(() => sayWord(q.id, q.word), 120);   // 本页内播答案，页面令牌一变就不再出声
  }
  setTimeout(() => {
    QI++;
    if (QI >= SES.qs.length) {
      const r = finishSession();
      go('result', { r, ses: SES });
      showUndo(code, qiNow, snap, true);
    } else {
      render();
      showUndo(code, qiNow, snap, false);
    }
  }, code === 'ok' ? 420 : 900);
}

/* ================= P05 昨日回声 ================= */
/* 旧版本只存了 {id,w}，没有 u；直接用 e.u.slice 会抛错，整页白掉。
   这里按 id（u01_005）反推单元和词，坏数据丢掉，保证回声页永远能画出来。 */
function normEcho(e) {
  if (!e || !e.id) return null;
  let u = e.u;
  if (typeof u === 'string') u = parseInt(u.replace(/[^0-9]/g, ''), 10);
  if (!u || (u < 1 || u > 12) || !U(u)) {
    const m = String(e.id).match(/^u(\d{2})_/);
    u = m ? parseInt(m[1], 10) : 0;
  }
  if (!u || u < 1 || u > 12 || !U(u)) return null;
  const unit = U(u);
  let w = e.w;
  if (!w) {
    const idx = parseInt(String(e.id).split('_')[1], 10);
    w = unit.words[idx - 1];
  }
  if (!w) return null;
  return { id: String(e.id), u: 'u' + String(u).padStart(2, '0'), w: String(w) };
}
function echoList() {
  const raw = Array.isArray(S.echo) ? S.echo : [];
  const list = raw.map(normEcho).filter(Boolean);
  if (list.length !== raw.length) { S.echo = list; save(); }
  return list;
}
function viewEcho(wrap) {
  const panel = el('div', 'panel rpWrap');
  panel.appendChild(el('div', 'h1', '把小鸭找回来'));
  const list = echoList();
  if (!list.length) {
    panel.classList.add('emptyEcho');

/* ================= 认词小站（sight words：听音选词卡） ================= */
/* 易混组：干扰项只从同组里出，否则孩子靠“长得完全不一样”就能排除，测不到辨形 */
const SIGHT_GROUPS = [
  ['the', 'this', 'is', 'it'],
  ['he', 'she', 'i', 'my'],
  ['what', 'where', 'you', 'yes'],
  ['a', 'can', 'do', 'to'],
  ['some', 'like', 'see', 'are']
];
function sightDistractors(target) {
  const g = SIGHT_GROUPS.find(x => x.includes(target));
  const same = g ? g.filter(w => w !== target) : [];
  if (same.length >= 3) return same.slice(0, 3);
  // 兜底：同首字母或同长度优先
  const alt = SIGHT.filter(w => w !== target && !same.includes(w));
  const score = w => (w.slice(0, 1) === target.slice(0, 1) ? 2 : 0) + (w.length === target.length ? 1 : 0);
  const picked = alt.slice().sort((a, b) => score(b) - score(a)).slice(0, 3 - same.length);
  return same.concat(picked);
}
function viewSight(wrap) {
  const N = 6;
  let round = 0, firstOk = 0, errThis = 0, t0 = Date.now();
  const pool = shuffle(SIGHT, Date.now() % 9999);
  const panel = el('div', 'panel');
  panel.style.width = 'min(1000px,94vw)'; panel.style.padding = '2.4vh 2vw';
  panel.style.display = 'flex'; panel.style.flexDirection = 'column'; panel.style.gap = '1.4vh'; panel.style.alignItems = 'center';
  panel.appendChild(el('div', 'h1', '认词小站'));
  panel.appendChild(el('div', 'mut', '只给文字卡、不给图。听清发音，点出对应的那张卡。家长在旁边念一遍规则就行，不用判分。'));
  wrap.appendChild(panel);

  const box = el('div', 'sightBox');
  panel.appendChild(box);

  function ask() {
    if (round >= N) return done();
    errThis = 0;
    const target = pool[round % pool.length];
    const others = sightDistractors(target);
    const opts = shuffle([target].concat(others), round + 7);
    box.innerHTML = '';
    const bar = el('div', 'row');
    bar.appendChild(el('div', 'chip', `第 ${round + 1} / ${N} 张`));
    const hear = el('button', 'btn sm', '再听一次');
    hear.onclick = () => sayAudio(`assets/audio/sight/${target}.mp3`, target);
    bar.appendChild(hear);
    box.appendChild(bar);
    const g = el('div', 'sightGrid');
    let locked = false;
    opts.forEach(o => {
      const c = el('div', 'sightCard', o);
      c.onclick = () => {
        if (locked) return;
        if (o === target) {
          locked = true;
          c.classList.add('ok');
          blip('ok'); sugarBurst(window.innerWidth / 2, window.innerHeight / 2);
          sayAudio(`assets/audio/sight/${target}.mp3`, target);
          if (!errThis) firstOk++;
          setTimeout(() => { round++; ask(); }, 700);
        } else {
          errThis++;
          c.classList.add('no'); c.style.opacity = '.4'; c.onclick = null;
          blip('hint');
        }
      };
      g.appendChild(c);
    });
    box.appendChild(g);
    laterOnPage(() => sayAudio(`assets/audio/sight/${target}.mp3`, target), 150);
  }

  function done() {
    const mins = Math.max(1, Math.round((Date.now() - t0) / 60000));
    const indep = Math.round(firstOk / N * 100);
    box.innerHTML = '';
    box.appendChild(el('div', 'h1', firstOk >= N - 1 ? '这些小家伙都认出来了' : '认出来一半，多听两遍'));
    box.appendChild(el('div', 'mut', `${N} 张卡，第一次就认对 ${firstOk} 张（${indep}%），用时 ${mins} 分钟`));
    const row = el('div', 'row');

    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
    S.sight = S.sight || [];
    S.sight.push({ ts: todayStr(), firstOk, n: N });
    S.meas = S.meas || [];
    S.meas.push({ ts: todayStr(), key: 'sight', drill: true, mins, indep, away: 0, stars: null });
    save();
  }

  ask();
}

/* 句子分词：保留标点，供句型页逐词显示 */
function sentTokens(t) { return String(t).replace(/—/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean); }
/* 同一句型三条例句对比：算出共同前缀/后缀，中间那段就是“可以替换的部分”。
   这样 ④ 替换只给“同句型里真实出现过的说法”，不会拼出 It has girl 这种错句。 */
function sentAlign(exs) {
  const toks = exs.map(sentTokens);
  const core = s => String(s).replace(/[.,!?'’]/g, '').toLowerCase();
  const base = toks[0];
  const n = Math.min.apply(null, toks.map(t => t.length));
  let p = 0;
  while (p < n && toks.every(t => core(t[p]) === core(base[p]))) p++;
  let s = 0;
  while (s < n - p && toks.every(t => core(t[t.length - 1 - s]) === core(base[base.length - 1 - s]))) s++;
  return {
    p, s, toks,
    slots: toks.map(t => t.slice(p, t.length - s).join(' ')),
    slotText: toks.map(t => t.slice(p, t.length - s).join(' ').replace(/[.,!?]$/, ''))
  };
}

function viewSentence(wrap) {
  const c = ctxToday();
  const u = P.u || c.u, wi = P.wi || c.wi;

  if (!unit.sentences || !unit.sentences.length) {

    return;
  }
  const nSent = unit.sentences.length;
  /* 每次从营地进句型回声，自动换到下一组；上一组/下一组按钮仍按 P.gi 精确跳。
     旧逻辑按“周数”定组，同一周反复进去永远是同一组。 */
  if (!S.sentRot) S.sentRot = {};
  let gidx;
  if (P.gi == null) {
    const last = Number(S.sentRot[u]);
    gidx = Number.isFinite(last) ? (last + 1) % nSent : (wi - 1) % nSent;
  } else {
    gidx = Math.max(0, Math.min(nSent - 1, P.gi));
  }
  S.sentRot[u] = gidx; save();
  const s = unit.sentences[gidx];
  const sent = s.ex[0].replace(/—/g, ' ').replace(/\s+/g, ' ').trim();
  const words = sentTokens(sent);
  const mode = P.mode || 'g1';
  const align = sentAlign(s.ex);                 // 三条例句对齐后的“可替换段”
  const slotStart = align.p, slotEnd = words.length - align.s;
  const paper = el('div', 'paper');
  paper.appendChild(el('div', 'mut', `${u} 号营地 · 句型回声 · 第 ${gidx + 1}/${unit.sentences.length} 组`));
  const line = el('div', 'sentLine');
  const spans = [];
  // 功能词（it / is / a / not）挖空没意义，只在实词里挑空
  const FUNC = /^(it'?s?|is|are|am|a|an|the|and|or|not|no|i|you|we|they|he|she|has|have|do|does|can|this|that|my|your|his|her)$/i;
  const blanks = words.map((w, i) => i).filter(i => !FUNC.test(words[i].replace(/[^A-Za-z']/g, '')));
  // ③ 挖空：每次进来随机挑一个实词，不再固定挖最后一个
  let blankIdx = blanks.length ? blanks[Math.floor(Math.random() * blanks.length)] : words.length - 1;
  if (P.blank != null && mode === 'g2') blankIdx = P.blank;
  const showBlank = (mode === 'g2' || mode === 'g3');
  let slotSpan = null;
  words.forEach((w, i) => {
    const inSlot = mode === 'g3' && i >= slotStart && i < slotEnd;
    if (inSlot) {
      // ④ 替换：整段可替换部分合成一个虚线空格（可能是 a duck / a trunk 这样的短语）
      if (i === slotStart) {
        // 虚线里先放原句的说法（如 a duck），孩子知道整句长什么样，再换别的
        slotSpan = el('span', 'w blank', align.slotText[0]);

  const tabs = el('div', 'hintRow');

  // 第一次进句型页自动讲一遍四步，之后再问就看按钮

  const ctr = el('div', 'hintRow');
  if (mode === 'g1' || mode === 'g1p') {

    b.onclick = () => playWords(u, words, spans, mode === 'g1p');

    const b2 = el('button', 'btn sm ghost', '只读这一句');
    b2.onclick = () => saySent(u, gidx, 0, sent, 0.82);
    ctr.appendChild(b2);
  }
  if (mode === 'g2') {
    let helped = 0;
    const hintChip = el('div', 'chip');
    hintChip.style.display = 'none';
    const b1 = el('button', 'btn sm', '再听整句');

      helped++;
      const w = words[blankIdx];
      hintChip.style.display = 'flex';

      else if (helped === 2) hintChip.textContent = `${w.slice(0, Math.ceil(w.length / 2))}…`;  // 二级：给前半个词
      else hintChip.textContent = `最后一个字：${w}（下次自己先试试）`;                  // 三级才给答案
    };
    ctr.appendChild(b2);
    const b3 = el('button', 'btn sm ghost', '换个空');
    if (blanks.length > 1) {

  }
  if (mode === 'g3') {

    // 只给“同句型其它例句里真实出现过的说法”，书上的原句，保证语义通顺；
    // 不再从整个单元随便抽词，避免 It has girl 这种错句。
    const alts = align.slotText.slice(1).filter(x => x && x !== align.slotText[0]);
    alts.forEach((ph, k) => {
      const t = el('div', 'pickWord', ph);
      t.onclick = () => {

        // 换词后的整句也用 Jenny 同一个声音预生成了 mp3（uXX_gNN_vK），
        // 不再交给手机系统 TTS，避免同一个词在句子里和词卡里听起来是两个人。
        const punct = (align.slots[0].match(/[.,!?]$/) || [''])[0];
        const newSent = align.toks[0].slice(0, slotStart).join(' ') + ' ' + ph + punct +
          (slotEnd < align.toks[0].length ? ' ' + align.toks[0].slice(slotEnd).join(' ') : '');
        const clean = newSent.replace(/\s+([.,!?])/g, '$1');
        const vp = `assets/audio/sent/${unitKey(u)}_g${pad2(gidx + 1)}_v${k + 1}.mp3`;
        sayAudio(vp, speechText(clean), 0.8);
      };
      chips.appendChild(t);
    });
    paper.appendChild(el('div', 'mut', '点一张卡，把虚线空格换成这句话里的说法；换完还是一句对的英文，跟着读一遍'));
    paper.appendChild(chips);
    if (!alts.length) paper.appendChild(el('div', 'mut', '这组句型只有一种说法，暂时没有可替换的例句。'));
  }
  paper.appendChild(ctr);
  // 句型不打分：只记录“做到哪一步”，所以用记录语义，不用评分语义
  const judge = el('div', 'sayRow');

  [['g', '我做到了', 'g'], ['hint', '再听一遍', 'y']].forEach(([k, n, cls]) => {
    const b = el('div', 'sayBtn ' + cls, n);
    b.onclick = () => {
      blip(k === 'g' ? 'ok' : 'hint');

  if (nSent > 1) {

    next.onclick = () => go('sentence', { u, wi, mode, gi: (gidx + 1) % nSent });
    nav.appendChild(prev); nav.appendChild(next);
    paper.appendChild(nav);
  }
  wrap.appendChild(paper);
  if (mode === 'g1') { const ps = PAGE_SEQ; setTimeout(() => { if (ps === PAGE_SEQ) playWords(u, words, spans, false); }, 350); }
  // 挖空必须先有原音输入：进来就整句播一遍，再让孩子填
  if (mode === 'g2') { const ps = PAGE_SEQ; setTimeout(() => { if (ps === PAGE_SEQ) saySent(u, gidx, 0, sent, 0.82); }, 400); }
}
function playWords(u, words, spans, tapMode) {
  stopAudio();
  // 先把整句要用的词音全部预加载，避免读到最后一个词才开始下载
  const unit = U(u);
  words.forEach(w => {
    const clean = String(w).replace(/[^A-Za-z']/g, '');
    const i = unit.words.indexOf(clean);
    if (i >= 0) preloadAudio(`assets/audio/words/${unitKey(u)}_${pad3(i + 1)}.mp3`);
  });
  const seq = AUDIO_SEQ;
  let i = 0;
  const step = () => {
    if (seq !== AUDIO_SEQ) return;      // 已经切页/切题，停止这条朗读链
    spans.forEach(s => s.classList.remove('hot', 'done'));
    if (i >= words.length) { spans.forEach(s => s.classList.remove('hot')); return; }
    spans[i].classList.add('hot');
    if (tapMode) spans[i].classList.add('done');
    const w = words[i];
    i++;
    let moved = false;
    const next = () => {
      if (moved || seq !== AUDIO_SEQ) return;
      moved = true;
      // 间隔从 260ms 收到 120ms：原来每词之间空得太久，听感像“最后一个慢半拍”
      setTimeout(step, 120);
    };
    sayWordIn(u, w, 0.8, next);
    setTimeout(next, Math.max(700, w.length * 120 + 400));
  };
  step();
}

  const row2 = el('div', 'row');
  const bSkip = el('button', 'btn sm ghost', '把本周标为停课');
  bSkip.onclick = () => { if (!S.holidays.includes(c.w)) { S.holidays.push(c.w); save(); alert('已标为停课，本周不出新关。'); render(); } };
  const bReset = el('button', 'btn sm danger', '清空所有进度');
  bReset.onclick = () => { if (confirm('会删掉全部星星、贴纸、徽章、见习章、果冻图鉴、营火等级、救鸭记录和掌握度。确定？')) { localStorage.removeItem(KEY); S = defState(); save(); go('camp'); } };
  const bDrill = el('button', 'btn sm', '勾选复习清单');
  bDrill.onclick = () => openDrillPicker(c.u);
  const bClrMeas = el('button', 'btn sm ghost', '清空实测记录');
  bClrMeas.onclick = () => { if (confirm('只删「实测记录」这几行，星星和掌握度都不动。')) { S.meas = []; save(); alert('已清空实测记录。'); render(); } };
  row2.appendChild(bSkip); row2.appendChild(bDrill); row2.appendChild(bClrMeas);
  panel.appendChild(row2);

  // 跟斑马课表对齐
  panel.appendChild(el('div', 'h2', '跟课表对齐（防止跑到新课前面）'));
  const rowP = el('div', 'row');
  const lab = el('label', 'mut');
  lab.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:16px';
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!S.onlyLearned;
  cb.onchange = () => { S.onlyLearned = cb.checked; save(); render(); };
  const cbTxt = el('span', '', '只出已经学过的词');
  lab.appendChild(cb); lab.appendChild(cbTxt);
  rowP.appendChild(lab);
  const sel = el('select');
  sel.style.cssText = 'font-family:inherit;font-size:15px;padding:.45em .7em;border-radius:12px;border:2px solid #E7D6BE;background:#fff';
  [['0', '游戏进度＝课表（0 周）'], ['1', '游戏落后课表 1 周'], ['2', '游戏落后课表 2 周']].forEach(([v, t]) => {
    const o = el('option', '', t); o.value = v;
    if (String(S.lag || 0) === v) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { S.lag = parseInt(sel.value, 10) || 0; save(); render(); };
  rowP.appendChild(sel);
  rowP.appendChild(el('div', 'chip', `目前允许到第 ${learnedWeek()} 周`));
  panel.appendChild(rowP);
  panel.appendChild(el('div', 'mut', '斑马某周停课没上，就把它标成停课；如果课表整体比游戏慢，选「落后 1 周」，游戏就只用更早的词。'));

  // 流畅模式：老平板/手机开这个，画面少一点效果，但点按和翻页更跟手
  panel.appendChild(el('div', 'h2', '流畅模式'));
  const rowL = el('div', 'row');
  const labL = el('label', 'mut');
  labL.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:16px';
  const cbL = el('input'); cbL.type = 'checkbox';
  const autoLite = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3;
  cbL.checked = S.lite == null ? autoLite : !!S.lite;
  cbL.onchange = () => { S.lite = cbL.checked; save(); applyLite(); };
  labL.appendChild(cbL); labL.appendChild(el('span', '', '开启流畅模式'));
  rowL.appendChild(labL);
  rowL.appendChild(el('div', 'mut', '去掉大阴影和小动画，低配设备点起来更跟手。如果还是卡，关掉再试。'));
  panel.appendChild(rowL);

  // 备份：导出 / 导入
  panel.appendChild(el('div', 'h2', '备份（防止清缓存后从 0 开始）'));
  const rowB = el('div', 'row');
  const bExp = el('button', 'btn sm', '导出备份');
  bExp.onclick = () => {
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = el('a'); a.href = URL.createObjectURL(blob);
    a.download = `斑马S3备份_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    S.lastBackup = todayStr(); save(); render();
  };
  const bImp = el('button', 'btn sm ghost', '导入备份');
  const fi = el('input'); fi.type = 'file'; fi.accept = '.json,application/json'; fi.style.display = 'none';
  fi.onchange = () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(fr.result);
        if (!o || !o.mastery || !o.start) throw new Error('bad');
        S = Object.assign(defState(), o); save();
        alert('导入成功：星星、词卡掌握度、贴纸、错题都回来了。');
        render();
      } catch (e) { alert('这个文件不是本游戏的备份，没动你的数据。'); }
    };
    fr.readAsText(f);
  };
  bImp.onclick = () => fi.click();
  rowB.appendChild(bExp); rowB.appendChild(bImp); rowB.appendChild(fi);
  panel.appendChild(rowB);
  const lastB = S.lastBackup ? `最近备份：${S.lastBackup}` : '还没备份过，建议现在导一次';
  const warn = S.lastBackup && daysBetween(S.lastBackup, todayStr()) > 7 ? '（超过 7 天了，再导一次吧）' : '';
  panel.appendChild(el('div', 'mut', lastB + warn));

  const bCode = el('button', 'btn sm ghost', '备份码（复制/粘贴）');
  bCode.onclick = () => openBackupCode();
  panel.appendChild(bCode);

  // 手动跳关
  panel.appendChild(el('div', 'h2', '手动指定进度'));
  const row3 = el('div', 'row');
  for (let u = 1; u <= 12; u++) {
    const b = el('div', 'uChip' + (u === c.u ? ' sel' : ''), 'U' + u);
    b.onclick = () => { S.start = addDays(todayStr(), -(u - 1) * 28 - (c.wi - 1) * 7 - 7 * countHolBefore(u)); save(); render(); };
    row3.appendChild(b);
  }
  row3.style.flexWrap = 'wrap';
  panel.appendChild(el('div', 'mut', '点一个单元，把「今天」对齐到该单元第 1 周（会改动开学日，不改历史成绩）'));
  panel.appendChild(row3);

  const row4 = el('div', 'row');
  const bRpt = el('button', 'btn sm', '看家长周报'); bRpt.onclick = () => go('report');
  const bEcho = el('button', 'btn sm ghost', '回声页'); bEcho.onclick = () => go('echo');
  row4.appendChild(bRpt); row4.appendChild(bEcho);
  panel.appendChild(row4);
  // 危险区：单独下沉，红按钮，别和日常操作混在一起
  const danger = el('div', 'dangerZone');
  danger.appendChild(el('div', 'h2', '危险区（会删数据，平时不用碰）'));
  danger.appendChild(el('div', 'mut', '清空后星星、贴纸、徽章、见习章、果冻图鉴、营火等级、救鸭记录、掌握度、实测记录全部归零，建议先导出备份。'));
  danger.appendChild(bReset);
  panel.appendChild(danger);
  // 小屏/横屏时整页可滚动，给底部固定导航留出空间，否则最后一行按钮会被盖住
  panel.style.maxHeight = '92vh'; panel.style.overflowY = 'auto'; panel.style.paddingBottom = '14vh';
  wrap.appendChild(panel);
}
function countHolBefore(u) { return S.holidays.filter(h => h < 4 * (u - 1)).length; }

/* ================= 启动 ================= */
load(); migrate(); initVoice(); bindQuizKeys(); trackAway(); decay(todayStr());
applyLite();
VIEW = 'camp';
render();
warmBgs();   // 空闲时把 9 张背景预热完，换页不再每张等一分钟

</script>
</body>
</html>
